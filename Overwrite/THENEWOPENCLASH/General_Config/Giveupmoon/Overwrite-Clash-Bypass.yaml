# ==========================================================
# dns（从源文件直接提取）
# ----------------------------------------------------------
# 原始 DNS 配置，默认注释不启用。
# 如只需修改部分字段，直接写需要修改的键值即可（默认合并，不影响其他字段）。
# 如需完整替换 DNS 配置，使用 dns!: 操作符。
# ==========================================================
#
# dns:
#   default-nameserver:
#   - https://223.5.5.5/dns-query
#   - tls://1.1.1.1:853
#   nameserver:
#   - https://doh.pub/dns-query
#   - https://dns.alidns.com/dns-query
